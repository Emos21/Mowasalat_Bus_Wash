{% extends 'base.html' %}
{% load static %}
{% block content %}
<style>
    #dmage_repor_card {
        height: 50vh;
        box-shadow: 0 3px 6px rgba(0, 0, 0, 0.16), 0 3px 6px rgba(0, 0, 0, 0.23);
    }

    #dmage_repor_img_holder {
        width: 100%;
        height: 35vh;
    
    }

    #dmage_repor_img_holder img {
        width: 100%;
        height: 100%;

    }
    #dmage_repor_card_body{
        padding: 10px 20px;
    }
</style>

<div class="row">
    {% for data in damagenotifications %}
    <div class="col-md-3">
        <div id="dmage_repor_card">
            <div id="dmage_repor_img_holder">
                <img src="{{ data.avatar.url }}" alt="">
            </div>
            <div id="dmage_repor_card_body">
                <h3>{{data.name}}</h3>
                <h5>{{ data.comment }}</h5>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
