{% extends 'base.html' %}
{% load static %}

{% block title %}
Upload New Task
{% endblock title %}

{% block content %}
<!-- CSS only -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

<!-- JavaScript Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
    crossorigin="anonymous"></script>
<script src="http://cdnjs.cloudflare.com/ajax/libs/raphael/2.1.0/raphael-min.js"></script>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"
    integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/morris.js/0.5.1/morris.min.js"
    integrity="sha512-6Cwk0kyyPu8pyO9DdwyN+jcGzvZQbUzQNLI0PadCY3ikWFXW9Jkat+yrnloE63dzAKmJ1WNeryPd1yszfj7kqQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/morris.js/0.5.1/morris.css"
    integrity="sha512-fjy4e481VEA/OTVR4+WHMlZ4wcX/+ohNWKpVfb7q+YNnOCS++4ZDn3Vi6EaA2HJ89VXARJt7VvuAKaQ/gs1CbQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/morris.js/0.5.1/morris.js"
    integrity="sha512-CYkt9kgBjbQrIKQGbyezfkmhmmFwMF2VVZjdGgYJJm3KnV53Ao+aFnndz2YbmMX2Y8XGBCUzBxFTqg2LAuIJzw=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
{% if user.is_authenticated %}

<section>

    <div id="upload_container_form" style="width: 100%;">
        <div id="upload_form" style="width: 100% !important">
            {% for task in tasks %}
            <form method="POST" action="/timestamp/{{task.id}}">
                {% csrf_token %}
                <button type="submit" id="stop_watch_btn">{{ task.timer_state }}</button>
            </form>
            {% endfor %}


            <form method="post" id="personForm" data-cities-url="{% url 'ajax_load_cities' %}"
                enctype="multipart/form-data">
                {% csrf_token %}

                <p>
                    <label for="id_name">Site Name:</label>
                    <input type="text" name="site_name" value="{{site.site_code}}" maxlength="60" required=""
                        id="id_name">
                </p>
                <p>
                    <label for="id_location">Location:</label>
                    <select name="location" id="id_location">

                        <option value="{{site.location.id}}">{{site.location.name}}</option>

                    </select>
                </p>
                <p>
                    <label for="id_typeofwash">Typeofwash:</label>
                    <select name="typeofwash" id="id_typeofwash">
                        <option value="" selected="">---------</option>
                        {% for t_wash in type_wash %}
                        <option value="{{t_wash.id}}">{{t_wash.name}}</option>
                        {% endfor %}

                    </select>
                </p>

                <p>
                    <label for="id_beforewashimg">Beforewashing:</label>
                    <input type="file" name="beforewashing" accept="image/*" id="id_beforewashimg" required="">
                </p>

                <div>
                    <span class="btn btn-primary" id="add-damage">Add Damage</span>
                    <div class="card">
                        <div class="card-body">
                            <div id="data-damage">

                            </div>
                        </div>
                    </div>
                </div>
                <input type="hidden" name="site_id" value="{{site_id}}">
                <input type="hidden" name="work_id" value="0">
                <input type="submit" value="Submit" class="submit_add_btn">
            </form>

        </div>


    </div>
</section>



{% else %}
login first
{% endif %}
<script>
    $(() => {
        var damageBody = () => {
            var body = $(`
            <div class="parent-damage row">
                <div class="col-md-3">
                    <span class="btn btn-sm btn-danger mt-2 delete-damages">Remove</span>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label for="" class="control-label">Damages</label>
                        <input name="name" id="" class="form-control">
                        <input type="hidden" name="damage_id" value=0>
    
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label for="" class="control-label">Comment</label>
                        <input name="comment" id="" class="form-control">
                    
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="form-group">
                        <label for="" class="control-label">Image</label>
                        <input type="file" name="avatar" id="id_beforewashimg" class="form-control">
                    
                    </div>
                </div>
            </div>
            `).clone();
            return body;
        }
        $('#add-damage').on('click', (e) => {
            var body = damageBody();
            $('#data-damage').append(body)
            $('.delete-damages').on('click',(e)=>{
                var parentCol = $(e.currentTarget).parent('.col-md-3');
                var parentDiv = $(parentCol).parent('.parent-damage')
                console.log(parentDiv);
                $(parentDiv).remove();
                
            })

        })
    })
</script>

{% endblock content %}
