{% load static %}
<!-- Navbar -->
<div class="topbar">
    <div class="toggle">
        <ion-icon name="menu-outline" id="open_nav_cs"></ion-icon>
        <ion-icon name="close-outline" id="close_nav_cs"></ion-icon>
    </div>

    <div class="topbar-controls" style="margin-left: auto; display: flex; align-items: center; gap: 15px;">
        <!-- Notifications Bell -->
        <div class="notification-bell" style="position: relative;">
            <button id="notification-toggle" class="btn btn-sm theme-btn" onclick="toggleNotifications()">
                <ion-icon name="notifications-outline"></ion-icon>
                <span id="notification-badge" class="notification-badge" style="display: none;">0</span>
            </button>
            <div id="notification-dropdown" class="notification-dropdown" style="display: none;">
                <div class="notification-header">
                    <span data-translate="Notifications">Notifications</span>
                    <button onclick="markAllRead()" class="mark-all-btn">Mark all read</button>
                </div>
                <div id="notification-list" class="notification-list">
                    <p class="no-notifications">No new notifications</p>
                </div>
            </div>
        </div>

        <!-- Theme Toggle -->
        <div class="theme-switch">
            <button id="theme-toggle" class="btn btn-sm theme-btn" onclick="toggleTheme()">
                <ion-icon name="moon-outline" id="theme-icon-dark"></ion-icon>
                <ion-icon name="sunny-outline" id="theme-icon-light" style="display: none;"></ion-icon>
            </button>
        </div>

        <!-- Language Switch -->
        <div class="lang-switch" style="display: flex; align-items: center;">
            <button id="lang-en" class="btn btn-sm btn-outline-primary lang-btn active" onclick="setLanguage('en')">EN</button>
            <button id="lang-ar" class="btn btn-sm btn-outline-primary lang-btn" onclick="setLanguage('ar')">عربي</button>
        </div>
    </div>
</div>

<style>
/* Notification Bell */
.notification-bell {
    position: relative;
}
.notification-badge {
    position: absolute;
    top: -5px;
    right: -5px;
    background: #dc3545;
    color: white;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 50%;
    min-width: 18px;
    text-align: center;
}
.notification-dropdown {
    position: absolute;
    top: 50px;
    right: 0;
    width: 320px;
    max-height: 400px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.15);
    z-index: 1000;
    overflow: hidden;
}
.notification-header {
    padding: 15px;
    border-bottom: 1px solid #eee;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: bold;
}
.mark-all-btn {
    background: none;
    border: none;
    color: #008cff;
    font-size: 12px;
    cursor: pointer;
    width: auto;
    height: auto;
    border-radius: 0;
}
.notification-list {
    max-height: 300px;
    overflow-y: auto;
}
.notification-item {
    padding: 12px 15px;
    border-bottom: 1px solid #f0f0f0;
    cursor: pointer;
    transition: background 0.2s;
}
.notification-item:hover {
    background: #f8f9fa;
}
.notification-item.unread {
    background: #e8f4fd;
}
.notification-item .title {
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 4px;
}
.notification-item .message {
    font-size: 12px;
    color: #666;
}
.notification-item .time {
    font-size: 10px;
    color: #999;
    margin-top: 4px;
}
.no-notifications {
    padding: 30px;
    text-align: center;
    color: #999;
}
[data-theme="dark"] .notification-dropdown {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
}
[data-theme="dark"] .notification-header {
    border-color: var(--border-color);
}
[data-theme="dark"] .notification-item {
    border-color: var(--border-color);
}
[data-theme="dark"] .notification-item:hover {
    background: var(--bg-secondary);
}
[data-theme="dark"] .notification-item.unread {
    background: rgba(0, 140, 255, 0.1);
}

/* Theme Toggle */
.theme-btn {
    background: transparent;
    border: 2px solid #008cff;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
}
.theme-btn ion-icon {
    font-size: 1.3rem;
    color: #008cff;
}
.theme-btn:hover {
    background: #008cff;
}
.theme-btn:hover ion-icon {
    color: white;
}

/* Language Switch */
.lang-switch .lang-btn {
    margin: 0 5px;
    padding: 5px 15px;
    border-radius: 20px;
    font-weight: bold;
}
.lang-switch .lang-btn.active {
    background-color: #008cff;
    color: white;
}

/* RTL Support */
[dir="rtl"] .main {
    direction: rtl;
    text-align: right;
}
[dir="rtl"] .cardBox {
    flex-direction: row-reverse;
}

/* ==================== DARK MODE STYLES ==================== */
[data-theme="dark"] {
    --bg-primary: #1a1a2e;
    --bg-secondary: #16213e;
    --bg-card: #1f2940;
    --text-primary: #ffffff;
    --text-secondary: #a0aec0;
    --border-color: #2d3748;
}

[data-theme="dark"] body {
    background-color: var(--bg-primary);
    color: var(--text-primary);
}

[data-theme="dark"] .main {
    background-color: var(--bg-primary);
}

[data-theme="dark"] .navigation {
    background: #0f3460;
    border-color: #0f3460;
}

[data-theme="dark"] .cardBox #card {
    background: var(--bg-card);
    box-shadow: 0 7px 25px rgba(0, 0, 0, 0.3);
}

[data-theme="dark"] .cardBox #card .numbers {
    color: #60a5fa;
}

[data-theme="dark"] .cardBox #card .cardName {
    color: var(--text-secondary);
}

[data-theme="dark"] .cardBox #card .iconBx {
    color: var(--text-secondary);
}

[data-theme="dark"] .cardBox #card:hover {
    background: #008cff;
}

[data-theme="dark"] .cardBox #card:hover .numbers,
[data-theme="dark"] .cardBox #card:hover .cardName,
[data-theme="dark"] .cardBox #card:hover .iconBx {
    color: white;
}

[data-theme="dark"] .topbar {
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border-color);
}

[data-theme="dark"] .toggle ion-icon {
    color: var(--text-primary);
}

[data-theme="dark"] .bottom_card_sec {
    background: var(--bg-card);
    border-radius: 10px;
    padding: 20px;
}

[data-theme="dark"] table {
    color: var(--text-primary);
}

[data-theme="dark"] .table {
    --bs-table-bg: var(--bg-card);
    --bs-table-color: var(--text-primary);
}

[data-theme="dark"] .table thead th {
    background: var(--bg-secondary);
    color: var(--text-primary);
    border-color: var(--border-color);
}

[data-theme="dark"] .table td {
    border-color: var(--border-color);
}

[data-theme="dark"] .form-control,
[data-theme="dark"] input,
[data-theme="dark"] select,
[data-theme="dark"] textarea {
    background: var(--bg-card);
    color: var(--text-primary);
    border-color: var(--border-color);
}

[data-theme="dark"] .btn-outline-primary {
    color: #60a5fa;
    border-color: #60a5fa;
}

[data-theme="dark"] .theme-btn {
    border-color: #60a5fa;
}

[data-theme="dark"] .theme-btn ion-icon {
    color: #fbbf24;
}

[data-theme="dark"] #content_container {
    background: var(--bg-primary);
}

[data-theme="dark"] .alert {
    background: var(--bg-card);
    color: var(--text-primary);
}

/* Chart styles for dark mode */
[data-theme="dark"] canvas {
    filter: brightness(0.9);
}
</style>

<script>
const translations = {
    en: {
        'Total Tasks': 'Total Tasks',
        'Completed': 'Completed',
        'In Progress': 'In Progress',
        'Completion Rate': 'Completion Rate',
        'Damage Reports': 'Damage Reports',
        'Shelters': 'Shelters',
        'Locations': 'Locations',
        'Tasks Today': 'Tasks Today',
        'Dashboard': 'Dashboard',
        'Tasks': 'Tasks',
        'Sites': 'Sites',
        'Reports': 'Reports',
        'Add Task': 'Add Task',
        'Show Tasks': 'Show Tasks',
        'Scanner': 'Scanner',
        'Profile': 'Profile',
        'Logout': 'Logout',
        'Task by date range': 'Task by date range',
        'From': 'From',
        'To': 'To'
    },
    ar: {
        'Total Tasks': 'إجمالي المهام',
        'Completed': 'مكتمل',
        'In Progress': 'قيد التنفيذ',
        'Completion Rate': 'معدل الإنجاز',
        'Damage Reports': 'تقارير الأضرار',
        'Shelters': 'المظلات',
        'Locations': 'المواقع',
        'Tasks Today': 'مهام اليوم',
        'Dashboard': 'لوحة التحكم',
        'Tasks': 'المهام',
        'Sites': 'المواقع',
        'Reports': 'التقارير',
        'Add Task': 'إضافة مهمة',
        'Show Tasks': 'عرض المهام',
        'Scanner': 'الماسح',
        'Profile': 'الملف الشخصي',
        'Logout': 'تسجيل الخروج',
        'Task by date range': 'المهام حسب الفترة',
        'From': 'من',
        'To': 'إلى'
    }
};

function setLanguage(lang) {
    localStorage.setItem('mowasalat_lang', lang);
    document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('lang-' + lang).classList.add('active');

    if (lang === 'ar') {
        document.documentElement.setAttribute('dir', 'rtl');
        document.documentElement.setAttribute('lang', 'ar');
    } else {
        document.documentElement.setAttribute('dir', 'ltr');
        document.documentElement.setAttribute('lang', 'en');
    }

    // Translate elements with data-translate attribute
    document.querySelectorAll('[data-translate]').forEach(el => {
        const key = el.getAttribute('data-translate');
        if (translations[lang][key]) {
            el.textContent = translations[lang][key];
        }
    });

    // Translate card names
    document.querySelectorAll('.cardName').forEach(el => {
        const text = el.textContent.trim();
        Object.keys(translations.en).forEach(key => {
            if (text === translations.en[key] || text === translations.ar[key]) {
                el.textContent = translations[lang][key];
            }
        });
    });
}

// Load saved language on page load
document.addEventListener('DOMContentLoaded', function() {
    const savedLang = localStorage.getItem('mowasalat_lang') || 'en';
    setLanguage(savedLang);

    // Load saved theme
    const savedTheme = localStorage.getItem('mowasalat_theme') || 'light';
    setTheme(savedTheme);
});

// Theme toggle functions
function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute('data-theme');
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    setTheme(newTheme);
}

function setTheme(theme) {
    localStorage.setItem('mowasalat_theme', theme);
    document.documentElement.setAttribute('data-theme', theme);

    const darkIcon = document.getElementById('theme-icon-dark');
    const lightIcon = document.getElementById('theme-icon-light');

    if (theme === 'dark') {
        darkIcon.style.display = 'none';
        lightIcon.style.display = 'block';
    } else {
        darkIcon.style.display = 'block';
        lightIcon.style.display = 'none';
    }
}

// Notification System
let notificationDropdownOpen = false;

function toggleNotifications() {
    const dropdown = document.getElementById('notification-dropdown');
    notificationDropdownOpen = !notificationDropdownOpen;
    dropdown.style.display = notificationDropdownOpen ? 'block' : 'none';
    if (notificationDropdownOpen) {
        loadNotifications();
    }
}

function loadNotifications() {
    fetch('/api/notifications/')
        .then(response => response.json())
        .then(data => {
            updateNotificationBadge(data.unread_count);
            renderNotifications(data.notifications);
        })
        .catch(err => console.log('Error loading notifications:', err));
}

function updateNotificationBadge(count) {
    const badge = document.getElementById('notification-badge');
    if (count > 0) {
        badge.textContent = count > 99 ? '99+' : count;
        badge.style.display = 'block';
    } else {
        badge.style.display = 'none';
    }
}

function renderNotifications(notifications) {
    const list = document.getElementById('notification-list');
    if (notifications.length === 0) {
        list.innerHTML = '<p class="no-notifications">No new notifications</p>';
        return;
    }

    list.innerHTML = notifications.map(n => `
        <div class="notification-item ${n.is_read ? '' : 'unread'}" onclick="markRead(${n.id})">
            <div class="title">${n.title}</div>
            <div class="message">${n.message}</div>
            <div class="time">${formatTime(n.created_at)}</div>
        </div>
    `).join('');
}

function formatTime(dateStr) {
    const date = new Date(dateStr);
    const now = new Date();
    const diff = Math.floor((now - date) / 1000);

    if (diff < 60) return 'Just now';
    if (diff < 3600) return Math.floor(diff / 60) + ' min ago';
    if (diff < 86400) return Math.floor(diff / 3600) + ' hours ago';
    return date.toLocaleDateString();
}

function markRead(notificationId) {
    fetch(`/api/notifications/${notificationId}/read/`, { method: 'POST' })
        .then(() => loadNotifications())
        .catch(err => console.log('Error:', err));
}

function markAllRead() {
    fetch('/api/notifications/mark-all-read/', { method: 'POST' })
        .then(() => loadNotifications())
        .catch(err => console.log('Error:', err));
}

// Close dropdown when clicking outside
document.addEventListener('click', function(e) {
    const bell = document.querySelector('.notification-bell');
    const dropdown = document.getElementById('notification-dropdown');
    if (bell && !bell.contains(e.target) && notificationDropdownOpen) {
        dropdown.style.display = 'none';
        notificationDropdownOpen = false;
    }
});

// Poll for new notifications every 30 seconds
setInterval(function() {
    fetch('/api/notifications/')
        .then(response => response.json())
        .then(data => updateNotificationBadge(data.unread_count))
        .catch(err => {});
}, 30000);

// Initial load
document.addEventListener('DOMContentLoaded', function() {
    setTimeout(loadNotifications, 1000);
});
</script>
