<div class="navigation">
    


    <ul>

        <div id="aamal_logo">
            <a href="{% url 'home' %}">
                <img src="/static/assets/aamal_logo_white.png" alt="">
                Aamal Services
            </a>
        </div>


        {% if request.user.is_superuser %}

        <li>
            <a href="{% url 'home' %}">
                <span class="icon">
                    <ion-icon name="home-outline"></ion-icon>
                </span>
                <span class="title">Dashboard</span>
            </a>
        </li>
        {% else %}


        {% endif %}

        <li>
            <a href="{% url 'show_tasks' %}">
                <span class="icon">
                    <ion-icon name="clipboard-outline"></ion-icon>
                </span>
                <span class="title">Task List</span>
            </a>
        </li>



        <li>
            <a href="/site_list">
                <span class="icon">
                    <ion-icon name="location-outline"></ion-icon>
                </span>
                <span class="title">Site</span>
            </a>
        </li>
        

        <li>
            <a href="{% url 'reportIndex' %}">
                <span class="icon">
                    <ion-icon name="clipboard-outline"></ion-icon>
                </span>
                <span class="title">Reports</span>
            </a>
        </li>


        <li>
            <a href="{% url 'logout' %}">
                <span class="icon">
                    <ion-icon name="log-out-outline"></ion-icon>
                </span>
                <span class="title">Sign Out</span>
            </a>
        </li>
    </ul>
</div>


<script>
    $(function () {
        $('#topNav .nav-link').each(function () {
            var current = '{{ request.get_full_path | urlencode }}'
            if (current == $(this).attr('href')) {
                $(this).parent().addClass('active')
            }
        })
        $('#scanner-link').click(function () {
            uni_modal("Shelter scan", $(this).attr('data_url'))
        })
    })
</script>
