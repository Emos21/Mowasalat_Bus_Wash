{% extends "base.html" %}
{% load humanize %}
{% load customfilter %}
{% load qr_code %}
{% load static %}
{% block content %}

{% block headerContent %}
<style>
    img.img-thumbnail.avatar {
        width: 140px !important;
        height: 140px !important;
    }
</style>
{% endblock headerContent %}



<section class="py-3">
    <div class="container">
        <div class="card rounded-0 shadow-sm blur">
            <div class="card-body">
                <div class="container-fluid">
                    <form action="" id="employee-form">
                        {% csrf_token %}
                        <input type="hidden" name="id" value="{{ employee.id }}">
                        <div class="row">
                            <div class="col-lg-4 col-md-6 col-sm-12 col-md-12">
                                <div class="form-group mb-3">
                                    <label for="site_code" class="control-label">Site Name</label>
                                    <input type="text" class="form-control form-control-sm rounded-0" autofocus
                                        id="site_code" value="{{employee.site_code}}" name="site_code"
                                        required>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-lg-12 col-md-12 col-sm-12 col-md-12">
                                <div class="form-group mb-3">
                                    <label for="location" class="control-label">Location</label>
                                    <textarea rows="3" class="form-control form-control-sm rounded-0" id="location"
                                        name="location" required>{{employee.location}}</textarea>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-lg-6 col-md-8 col-sm-12 col-xs-12">
                                <div class="mb-3">
                                    <label for="avatar" class="form-label">Avatar</label>
                                    <input class="form-control" type="file" name="avatar" id="avatar" accept="image/*"
                                        onchange="display_image(this)">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-lg-6 col-md-8 col-sm-12 col-xs-12">
                                <div class="mb-3">
                                    <img src="{% if employee.avatar %}{{employee.avatar.url}}{% else %}{% static 'assets/default/img/no-image-available.png' %}{% endif %}"
                                        alt="" class="img-thumbnail avatar" id="cimg">
                                </div>
                            </div>
                        </div>
                        <div class="clear-fix py-2"></div>
                        <div class="text-end">
                            <button class="btn btn-primary btn-sm rounded-0 bg-gradient"><i class="fa fa-save"></i>
                                Save</button>
                            <a href="{% url 'site_list' %}"
                            class="btn-close" disabled aria-label="Close" ><i
                                    class="fa fa-angle-left"></i> Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</div>
{% endblock %}
{% block ScriptBlock %}
<script>
    function display_image(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function (e) {
                $('#cimg').attr('src', e.target.result);
            }
            reader.readAsDataURL(input.files[0]);
        } else {
            $('#cimg').attr('src', "{% if employee.avatar %}{{employee.avatar.url}}{% else %}{% static 'assets/default/img/no-image-available.png' %}{% endif %}");
        }
    }
    $(function () {
        $('#employee-form').submit(function (e) {
            e.preventDefault();
            var _this = $(this)
            $('.err-msg').remove();
            var el = $('<div>')
            el.addClass("alert alert-danger err-msg")
            el.hide()
            if (_this[0].checkValidity() == false) {
                _this[0].reportValidity();
                return false;
            }
            start_loader();
            $.ajax({
                headers: {
                    "X-CSRFToken": '{{csrf_token}}'
                },
                url: "{% url 'save-employee' %}",
                data: new FormData($(this)[0]),
                cache: false,
                contentType: false,
                processData: false,
                method: 'POST',
                type: 'POST',
                dataType: 'json',
                error: err => {
                    console.log(err)
                    alert("An error occured", 'error');
                    end_loader();
                },
                success: function (resp) {
                    if (typeof resp == 'object' && resp.status == 'success') {
                        location.href = "{% url 'site_list' %}"
                    } else if (resp.status == 'failed' && !!resp.msg) {
                        el.text(resp.msg)
                    } else {
                        el.text("An error occured", 'error');
                        end_loader();
                        console.err(resp)
                    }
                    _this.prepend(el)
                    el.show('slow')
                    $("html, body, .modal").scrollTop(0);
                    end_loader()
                }
            })
        })
    })
</script>
{% endblock ScriptBlock %}
